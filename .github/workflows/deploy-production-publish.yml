name: Deploy Cloud Run Job

on:
  push:
    branches:
      - main
      - fix/quality-check-samples
    paths:
      - scripts/publish_to_ice_qb_source_p1.py
      - Dockerfile
      - requirements.txt
      - .github/workflows/deploy-production-publish.yml
  workflow_dispatch:
    inputs:
      target_month:
        description: "Target month in YYYYMM format"
        required: true
        type: string
      execute:
        description: "Execute the production publish job after deployment"
        required: true
        default: false
        type: boolean
      apply:
        description: "Apply changes to ice_qb_source_p1. False performs comparison only."
        required: true
        default: false
        type: boolean
      confirmation:
        description: "When apply=true, enter the target month again to confirm"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: royalty-source-production-publish
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ice-qb
  GAR_LOCATION: asia-northeast1
  GAR_REPOSITORY: royalty-source
  IMAGE_NAME: royalty-source-job
  CLOUD_RUN_JOB: royalty-source-production-publish
  CLOUD_RUN_REGION: asia-northeast1
  BQ_CUMULATIVE_DATASET: royalty_cumulative
  BQ_AUDIT_DATASET: royalty_audit
  PRODUCTION_TARGET_DATASET: ice_qb_source_p1
  SOURCE_LOCATION: asia-northeast1
  TARGET_LOCATION: US

jobs:
  deploy:
    name: Build and deploy production publish job
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_DEPLOY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"
          docker build --no-cache -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"

      - name: Deploy production publish job
        shell: bash
        run: |
          set -euo pipefail
          ENV_VARS="GCP_PROJECT_ID=${GCP_PROJECT_ID},BQ_CUMULATIVE_DATASET=${BQ_CUMULATIVE_DATASET},BQ_AUDIT_DATASET=${BQ_AUDIT_DATASET},PRODUCTION_TARGET_DATASET=${PRODUCTION_TARGET_DATASET},SOURCE_LOCATION=${SOURCE_LOCATION},TARGET_LOCATION=${TARGET_LOCATION},PRODUCTION_PUBLISH_APPLY=false"
          gcloud run jobs deploy "${CLOUD_RUN_JOB}" \
            --image "${IMAGE_URI}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --service-account "${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}" \
            --command python \
            --args scripts/publish_to_ice_qb_source_p1.py \
            --set-env-vars "${ENV_VARS}" \
            --memory 2Gi \
            --cpu 1 \
            --task-timeout 1800 \
            --max-retries 0 \
            --quiet

      - name: Verify deployed production publish job
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_IMAGE="$(gcloud run jobs describe "${CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Expected image: ${IMAGE_URI}"
          echo "Deployed image: ${DEPLOYED_IMAGE}"
          test "${DEPLOYED_IMAGE}" = "${IMAGE_URI}"

      - name: Validate execution inputs
        if: github.event_name == 'workflow_dispatch' && inputs.execute
        shell: bash
        env:
          TARGET_MONTH: ${{ inputs.target_month }}
          APPLY: ${{ inputs.apply }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ ! "${TARGET_MONTH}" =~ ^[0-9]{6}$ ]]; then
            echo "target_month must use YYYYMM format" >&2
            exit 1
          fi
          MONTH="${TARGET_MONTH:4:2}"
          if (( 10#${MONTH} < 1 || 10#${MONTH} > 12 )); then
            echo "invalid target month: ${TARGET_MONTH}" >&2
            exit 1
          fi
          if [ "${APPLY}" = "true" ] && [ "${CONFIRMATION}" != "${TARGET_MONTH}" ]; then
            echo "apply=true requires confirmation to exactly match target_month" >&2
            exit 1
          fi

      - name: Execute production publish job
        if: github.event_name == 'workflow_dispatch' && inputs.execute
        id: execute_publish
        shell: bash
        env:
          TARGET_MONTH: ${{ inputs.target_month }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --update-env-vars "JOB_TARGET_MONTH=${TARGET_MONTH},PRODUCTION_PUBLISH_APPLY=${APPLY}" \
            --quiet
          EXECUTION_NAME="$(gcloud run jobs execute "${CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --wait \
            --format='value(metadata.name)')"
          echo "execution_name=${EXECUTION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Production publish execution: ${EXECUTION_NAME}"

      - name: Restore safe default
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          gcloud run jobs update "${CLOUD_RUN_JOB}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${CLOUD_RUN_REGION}" \
            --update-env-vars "PRODUCTION_PUBLISH_APPLY=false" \
            --quiet

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production publish job"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_URI}\` |"
            echo "| Job | \`${CLOUD_RUN_JOB}\` |"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              echo "| Target month | \`${{ inputs.target_month }}\` |"
              echo "| Execute | \`${{ inputs.execute }}\` |"
              echo "| Apply | \`${{ inputs.apply }}\` |"
              echo "| Execution | \`${{ steps.execute_publish.outputs.execution_name }}\` |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
