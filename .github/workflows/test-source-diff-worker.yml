name: Test source diff worker

on:
  pull_request:
    paths:
      - "app/source_diff_worker.py"
      - "scripts/publish_to_ice_qb_source_p1.py"
      - "tests/**"
      - ".github/workflows/test-source-diff-worker.yml"
  push:
    branches:
      - "feature/source-diff-worker-phase1"
    paths:
      - "app/source_diff_worker.py"
      - "scripts/publish_to_ice_qb_source_p1.py"
      - "tests/**"
      - ".github/workflows/test-source-diff-worker.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python
        run: |
          python -m py_compile             app/source_diff_worker.py             scripts/publish_to_ice_qb_source_p1.py             tests/test_source_diff_worker.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_source_diff_worker.py"
